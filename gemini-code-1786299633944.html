<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    .gallery-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .game-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 280px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    .game-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 10px 0 5px;
    }

    .game-description {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }

    /* Standard horizontal rating (default) */
    .rating {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .stars {
      color: #ffc107;
      font-weight: bold;
    }

    /* Game 3 vertical rating customization */
    #game-3 .rating {
      display: flex;
      flex-direction: column; /* Stacks elements vertically */
      align-items: flex-start; /* Aligns content to the left */
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <!-- Game 1 -->
    <div class="game-card" id="game-1">
      <img src="hero-photo.jpg" alt="Game 1">
      <div class="game-title">Cyber Quest</div>
      <div class="game-description">An immersive futuristic action RPG adventure.</div>
      <div class="rating">
        <span class="stars">★★★★☆ 4.2</span>
        <span>(1,230 reviews)</span>
      </div>
    </div>

    <!-- Game 2 -->
    <div class="game-card" id="game-2">
      <img src="hero-photo.jpg" alt="Game 2">
      <div class="game-title">Shadow Hunter</div>
      <div class="game-description">Explore dark dungeons and slay terrifying beasts.</div>
      <div class="rating">
        <span class="stars">★★★★★ 4.8</span>
        <span>(3,410 reviews)</span>
      </div>
    </div>

    <!-- Game 3 (Updated Rating Layout) -->
    <div class="game-card" id="game-3">
      <img src="monalisa-quiz.jpg" alt="Monalisa Quiz">
      <div class="game-title">Monalisa Quiz</div>
      <div class="game-description">Test your art history knowledge with fun quizzes.</div>
      <div class="rating">
        <span class="stars">★★★★☆ 4.5</span>
        <span class="review-count">(850 reviews)</span>
      </div>
    </div>
  </div>

</body>
</html>
